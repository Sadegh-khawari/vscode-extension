<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Coding Assistant</title>
    <style>
        body { font-family: var(--vscode-font-family); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 12px; border-bottom: 1px solid var(--vscode-panel-border); background: var(--vscode-panel-background); }
        .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; }
        .message.user { align-self: flex-end; background: var(--vscode-button-background); color: var(--vscode-button-foreground); border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: var(--vscode-textBlockQuote-background); border-bottom-left-radius: 4px; }
        .message pre { background: var(--vscode-textCodeBlock-background); padding: 10px; border-radius: 6px; overflow: auto; margin: 8px 0; }
        .message code { font-family: var(--vscode-editor-font-family); font-size: 0.9em; }
        .input-area { padding: 12px; border-top: 1px solid var(--vscode-panel-border); background: var(--vscode-panel-background); }
        .input-row { display: flex; gap: 8px; }
        textarea { flex: 1; min-height: 60px; max-height: 200px; padding: 10px; border: 1px solid var(--vscode-input-border); background: var(--vscode-input-background); color: var(--vscode-input-foreground); border-radius: 6px; resize: vertical; font-family: var(--vscode-font-family); }
        button { padding: 10px 16px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; border-radius: 6px; cursor: pointer; font-family: var(--vscode-font-family); }
        button:hover { background: var(--vscode-button-hoverBackground); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { font-size: 0.85em; color: var(--vscode-descriptionForeground); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <strong>LLM Coding Assistant</strong>
        <div class="status" id="status">Ready</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <div class="input-row">
            <textarea id="input" placeholder="Ask a coding question... (Shift+Enter for new line)"></textarea>
            <button id="send" title="Send (Enter)">Send</button>
        </div>
    </div>
    <script>
        const vscode = acquireVsCodeApi();
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendEl = document.getElementById('send');
        const statusEl = document.getElementById('status');

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = formatMessage(content);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function formatMessage(text) {
            return text
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            addMessage('user', text);
            inputEl.value = '';
            sendEl.disabled = true;
            setStatus('Thinking...');

            vscode.postMessage({
                type: 'chat',
                payload: { message: text }
            });
        }

        sendEl.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'chat-response') {
                addMessage('assistant', message.payload.content);
                sendEl.disabled = false;
                setStatus('Ready');
            } else if (message.type === 'error') {
                addMessage('assistant', 'Error: ' + message.payload);
                sendEl.disabled = false;
                setStatus('Error');
            }
        });
    </script>
</body>
</html>
